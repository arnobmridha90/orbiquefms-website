<script>
/* choose the company before the browser reads the manifest, so each company installs with its own name and icon */
(function () {
  var ok = { kilat: 1, padi: 1, bara: 1 }, q = (location.search.match(/[?&]co=(\w+)/) || [])[1], co;
  try { co = q && ok[q] ? q : (localStorage.getItem('fms.co') || 'kilat'); localStorage.setItem('fms.co', co); } catch (e) { co = q && ok[q] ? q : 'kilat'; }
  window.__CO = co;
  var names = { kilat: 'Kilat Staff', padi: 'Padi Emas Staff', bara: 'Bara Staff' };
  document.getElementById('manifestLink').href = 'manifest-' + co + '.webmanifest';
  document.getElementById('appleIcon').href = 'icons/' + co + '-180.png';
  document.getElementById('favIcon').href = 'icons/' + co + '-192.png';
  document.getElementById('appleTitle').content = names[co];
  document.title = names[co];
})();
</script>
