name: Build staff app APKs
on:
  push:
    branches: ['claude/project-thread-9mc8xa', 'claude/project-thread-jitn89']
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build debug APKs (one per company)
        working-directory: android
        run: gradle --no-daemon assembleKilatDebug assembleFmsDebug
      - name: Put each APK next to its web app so it has a direct download link
        run: |
          cp android/app/build/outputs/apk/kilat/debug/app-kilat-debug.apk app/m/kilat-staff.apk
          cp android/app/build/outputs/apk/fms/debug/app-fms-debug.apk app/s/orbique-fms.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add app/m/kilat-staff.apk app/s/orbique-fms.apk
          git commit -m "Build staff app APKs" || exit 0
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
      - uses: actions/upload-artifact@v4
        with: { name: staff-apks, path: android/app/build/outputs/apk/*/debug/*.apk }
