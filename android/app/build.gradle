plugins { id 'com.android.application' }
android {
  namespace 'com.orbique.fms.staff'
  compileSdk 34
  defaultConfig {
    applicationId 'com.orbique.fms.kilatstaff.demo'
    minSdk 24
    targetSdk 34
    versionCode 3
    versionName '0.2-demo'
  }
  signingConfigs {
    // Demo-only signing key, used so the web address can trust this app (no browser bar).
    // The real app will be signed with a private key kept outside the repository.
    demo { storeFile file('demo-signing.jks'); storePassword 'orbique-demo'; keyAlias 'demo'; keyPassword 'orbique-demo' }
  }
  buildTypes { debug { signingConfig signingConfigs.demo } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0' }
