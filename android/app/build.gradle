plugins { id 'com.android.application' }
android {
  namespace 'com.orbique.fms.staff'
  compileSdk 34
  defaultConfig {
    minSdk 24
    targetSdk 34
  }
  // One app per company. Each opens its company's web app full screen, so the content
  // (and every update to it) comes from the web address: no reinstall needed for updates.
  flavorDimensions 'company'
  productFlavors {
    kilat {
      dimension 'company'
      applicationId 'com.orbique.fms.kilatstaff.demo'
      versionCode 3
      versionName '0.2-demo'
      resValue 'string', 'app_name', 'Kilat Staff'
      manifestPlaceholders = [startUrl: 'https://app.orbiquefms.com/m/?co=kilat']
    }
    ventura {
      dimension 'company'
      applicationId 'com.orbique.fms.ventura'
      versionCode 1
      versionName '1.0'
      resValue 'string', 'app_name', 'Ventura Staff'
      manifestPlaceholders = [startUrl: 'https://app.orbiquefms.com/s/?co=ventura']
    }
  }
  signingConfigs {
    // Demo-only signing key, used so the web address can trust this app (no browser bar).
    // The real app will be signed with a private key kept outside the repository.
    demo { storeFile file('demo-signing.jks'); storePassword 'orbique-demo'; keyAlias 'demo'; keyPassword 'orbique-demo' }
  }
  buildTypes { debug { signingConfig signingConfigs.demo } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0' }
